<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80"
     role="img" aria-label="Nullfill">
  <title>Nullfill wordmark</title>
  <desc>The Nullfill mark beside the word Nullfill.</desc>
  <!-- Text uses a system font stack so the file stays editable. Convert to outlines before
       placing it anywhere a specific face matters. -->
  <g transform="translate(0,10)">
    <rect width="60" height="60" rx="15" fill="#16443C"/>
    <circle cx="30" cy="30" r="14.25" fill="none" stroke="#FAFAF8" stroke-width="5.6"
            stroke-dasharray="65.6 23.9" stroke-linecap="round"/>
    <circle cx="40.1" cy="19.9" r="5.8" fill="#C2601F"/>
  </g>
  <text x="76" y="54" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="38" font-weight="600" letter-spacing="-0.02em" fill="#12161B">Nullfill</text>
</svg>
