<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Nullfill">
  <title>Nullfill</title>
  <desc>A ring with a single gap in it, and a filled dot sitting in the gap. The gap is the transfer that never happened. The dot is the fill.</desc>
  <rect width="64" height="64" rx="16" fill="#16443C"/>
  <circle cx="32" cy="32" r="15.2" fill="none" stroke="#FAFAF8" stroke-width="6"
          stroke-dasharray="70 25.5" stroke-linecap="round"/>
  <circle cx="42.8" cy="21.2" r="6.2" fill="#C2601F"/>
</svg>
