<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300"
     role="img" aria-labelledby="banner-title banner-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="banner-title">Nullfill</title>
  <desc id="banner-desc">Nullfill: your transfer didn't fail, it never happened. Beside the words, the Nullfill ring, with a gap where a screened transaction disappears, and zero bytes on chain in the middle.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#F6F5F0" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="glowA" cx="88%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#E07A36" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E07A36" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#1F7A4D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1F7A4D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="#0E2F29"/>
  <rect width="1200" height="300" rx="24" fill="url(#glowA)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glowB)"/>
  <rect width="1200" height="300" rx="24" fill="url(#dots)"/>

  <g transform="translate(64,48)">
    <rect width="44" height="44" rx="11" fill="#F6F5F0"/>
    <circle cx="22" cy="22" r="10.4" fill="none" stroke="#16443C" stroke-width="4.1" stroke-dasharray="48 17.4" stroke-linecap="round"/>
    <circle cx="29.4" cy="14.6" r="4.3" fill="#C2601F"/>
  </g>
  <text x="122" y="80" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-1" fill="#F6F5F0">Nullfill</text>

  <text x="64" y="168" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="56" font-weight="700" letter-spacing="-2.4" fill="#F6F5F0">Your transfer didn't fail.</text>
  <text x="64" y="232" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="56" font-weight="700" letter-spacing="-2.4" fill="#F0A36C">It never happened.</text>
  <text x="64" y="270" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" fill="#F6F5F0" fill-opacity="0.72">An escrow for Robinhood Chain that survives a screened transaction. Settles in USDG.</text>

  <g transform="translate(1000,150)">
    <circle r="124" fill="none" stroke="#F6F5F0" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="2 7"/>
    <circle r="100" fill="none" stroke="#F6F5F0" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="537 91.3" transform="rotate(-62)"/>
    <line x1="0" y1="-70" x2="0" y2="-140" stroke="#F0A36C" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 7" opacity="0.85"/>
    <circle r="70" fill="#F6F5F0" fill-opacity="0.06" stroke="#F6F5F0" stroke-opacity="0.2"/>
    <text y="-24" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="9" font-weight="700" letter-spacing="1.5" fill="#F0A36C">SCREENED</text>
    <text y="20" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="52" font-weight="700" letter-spacing="-2" fill="#F6F5F0">0</text>
    <text y="40" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="8" font-weight="700" letter-spacing="1" fill="#F6F5F0" fill-opacity="0.7">BYTES ON CHAIN</text>
  </g>
</svg>
