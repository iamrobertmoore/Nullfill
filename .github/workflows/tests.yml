name: Tests

# The offline suites only. The live-chain checks (test/Deployment.t.sol and test/Fork.t.sol) talk to a
# public RPC that occasionally answers "unsupported block number" from a lagging node, and a red tick
# caused by someone else's load balancer would say something false about this code. Run those by hand;
# the README has the commands.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        run: forge build
      - name: Test, offline
        run: forge test -vv

  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: watch
        run: node --test

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: web
        run: node --test
